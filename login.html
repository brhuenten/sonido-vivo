<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonido Vivo - Pagina de Inicio de Sesión</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-azalea/30 text-gray-800 font-sans flex flex-col min-h-screen">
  
  <header class="bg-scampi text-white sticky top-0 z-50 shadow-md">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-bittersweet tracking-wider">SONIDO VIVO</a>
      <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium">
        <a href="index.html" class="hover:text-azalea">Inicio</a>
        <a href="contacto.html" class="hover:text-azalea">Contacto</a>
        <a href="nosotros.html" class="hover:text-azalea">Nosotros</a>
      </nav>
      <div class="flex items-center space-x-4">
        <a href="registro.html" class="bg-bittersweet hover:bg-bittersweet/90 text-white text-xs font-bold px-3 py-1.5 rounded transition">Registrarse</a>
      </div>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-10 flex justify-center items-center">
    
    <div class="bg-white p-8 rounded-lg shadow-xl border border-poloblue w-full max-w-md">
      <h2 class="text-2xl font-bold text-scampi mb-6 text-center border-b pb-3">Iniciar Sesión</h2>

      <form class="space-y-4">

        <div>
          <label class="block text-sm font-semibold text-scampi mb-1">Correo Electrónico:</label>
          <input type="email" id="loginCorreo" placeholder="ejemplo@dominio.com" class="w-full p-2 border border-poloblue rounded focus:outline-none focus:ring-2 focus:ring-bittersweet">
          <p id="errLoginCorreo" class="text-red-500 text-xs mt-1 font-medium hidden">Por favor ingresa un formato de correo válido (ejemplo@dominio.com).</p>  
        </div>

        <div>
          <label class="block text-sm font-semibold text-scampi mb-1">Contraseña:</label>
          <input type="password" id="loginPass" placeholder="••••••••" class="w-full p-2 border border-poloblue rounded focus:outline-none focus:ring-2 focus:ring-bittersweet">
          <p id="errLoginPass" class="text-red-500 text-xs mt-1 font-medium hidden">La contraseña debe contener entre 4 y 10 caracteres.</p>
        </div>

        <button type="submit" class="w-full bg-bittersweet hover:bg-bittersweet/90 text-white font-bold py-2.5 rounded transition shadow mt-4">
          Ingresar
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-scampi text-azalea text-xs py-6 text-center">
    <p>&copy; 2026 Tienda Sonido Vivo. Viña del Mar, Chile.</p>
  </footer>

</body>
</html>
